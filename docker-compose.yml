# SIPROCOM SGS — self-hosted deployment.
#
# Covers the "serveur interne SIPROCOM" option in §8. The cloud option needs no
# compose file: point DATABASE_URL at the managed database and deploy the two
# images separately.
#
#   cp .env.docker.example .env
#   docker compose up -d
#   docker compose exec api npx prisma migrate deploy
#
# The database is NOT published on the host by default. Uncomment the ports
# block below only if you need to reach PostgreSQL from outside the compose
# network — an exposed 5432 is one weak password away from a data breach.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siprocom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-siprocom_sgs}
      # Locale-aware collation for correct accented sorting in French.
      LANG: fr_FR.utf8
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-siprocom} -d ${POSTGRES_DB:-siprocom_sgs}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        # Waits for readiness, not just for the container to exist — the API
        # crashes on boot if it cannot reach the database.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-siprocom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siprocom_sgs}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-siprocom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siprocom_sgs}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Single instance here, so the in-process scheduler is the right choice.
      ENABLE_SCHEDULER: 'true'
      TZ: ${TZ:-Africa/Abidjan}
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db_data:
