<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SIPROCOM SGS">
  <!--
    Maskable variant. Windows, Android and the taskbar crop this to their own
    shape, so the background bleeds to the edges with no rounding of its own
    and the glyph stays inside the 40% safe radius. Using icon.svg here would
    get its corners shaved off.
  -->
  <rect width="512" height="512" fill="#3f6212"/>

  <rect x="178" y="158" width="156" height="58" rx="11" fill="#ecfccb"/>
  <rect x="197" y="178" width="34" height="18" rx="6" fill="#3f6212"/>

  <rect x="154" y="232" width="204" height="58" rx="11" fill="#a3e635"/>
  <rect x="173" y="252" width="34" height="18" rx="6" fill="#3f6212"/>

  <rect x="178" y="306" width="156" height="58" rx="11" fill="#ecfccb"/>
  <rect x="197" y="326" width="34" height="18" rx="6" fill="#3f6212"/>
</svg>
