<!doctype html>
<!-- lang is kept in sync with the active locale by src/i18n/index.js -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3f6212" />

    <!--
      Installability. With this manifest and a service worker, Edge and Chrome
      on Windows offer "Install this app": the SGS gets a Start-menu entry, a
      desktop icon and its own window with no address bar. See
      docs/INSTALLATION_POSTE.md.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="application-name" content="SIPROCOM SGS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SGS" />

    <title>SIPROCOM - SGS</title>
  </head>
  <body>
    <!--
      #root carries a visible placeholder that React replaces on mount. If the
      bundle fails to load or throws before mounting, the user sees this instead
      of a blank white page - the one failure that gives no clue whether the
      server is down, the port is wrong, or the app crashed.
    -->
    <div id="root">
      <div id="sgs-boot" style="
        min-height:100vh;display:flex;align-items:center;justify-content:center;
        font-family:system-ui,sans-serif;color:#64748b;background:#f1f5f9;text-align:center;padding:1.5rem">
        <div>
          <p style="font-weight:700;color:#3f6212;font-size:1.25rem;margin:0 0 .25rem">SIPROCOM</p>
          <p style="margin:0;font-size:.9rem">Chargement… · Loading…</p>
          <p id="sgs-boot-error" style="display:none;margin:1rem 0 0;font-size:.85rem;color:#b91c1c;max-width:30rem">
            L'application n'a pas pu démarrer. Vérifiez que le serveur tourne (<code>npm run dev</code>),
            puis rechargez.<br />
            <span style="color:#94a3b8">The application failed to start. Check the dev server is
            running, then reload.</span>
          </p>
        </div>
      </div>
    </div>

    <script>
      // If React has not replaced the placeholder after 10s, the bundle never
      // ran - surface that rather than leaving a spinner forever.
      setTimeout(function () {
        var boot = document.getElementById('sgs-boot');
        if (boot && document.body.contains(boot)) {
          document.getElementById('sgs-boot-error').style.display = 'block';
        }
      }, 10000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
